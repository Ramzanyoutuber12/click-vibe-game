<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Vibe - Web3 Edition</title>
    <!-- Light, reliable standard library that loads instantly -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { text-align: center; font-family: 'Segoe UI', sans-serif; background: #0d0d13; color: #fff; padding-top: 30px; }
        .container { max-width: 500px; margin: 0 auto; background: #1a1a24; padding: 25px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        #coin { width: 180px; height: 180px; background: linear-gradient(135deg, #ffd700, #ffa500); border-radius: 50%; display: inline-block; cursor: pointer; line-height: 180px; font-size: 28px; color: #111; font-weight: bold; user-select: none; box-shadow: 0 0 25px rgba(255,215,0,0.4); margin: 20px 0; transition: transform 0.05s; }
        #coin:active { transform: scale(0.92); }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #8247e5; color: white; border: none; border-radius: 8px; font-weight: bold; margin: 5px; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        .upgrade-card { background: #252538; padding: 12px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .status { color: #00ffcc; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Click Vibe Web3</h1>
        <button id="connectWalletBtn">🔌 Connect Wallet</button>
        <p id="walletStatus" class="status">Wallet Disconnected</p>

        <div id="coin">VIBE</div>
        <h2>Earned: <span id="balance">0</span> VIBE</h2>
        <p style="color: #aaa; font-size: 13px;">Current Multiplier: <span id="multiplierText">1x</span> (1 Click = <span id="perClickText">1</span> Token)</p>
        <p style="color: #ff3366; font-size: 13px; font-weight: bold;">Minimum Cashout: 10,000,000 VIBE</p>

        <hr style="border-color: #333; margin: 20px 0;">
        <h3>⚡ Buy Speed Upgrades</h3>
        <div class="upgrade-card"><span>🚀 10x Multiplier</span><button class="buy-btn" data-cost="0.5" data-mult="10">0.5 POL</button></div>
        <div class="upgrade-card"><span>🔥 100x Multiplier</span><button class="buy-btn" data-cost="2.0" data-mult="100">2.0 POL</button></div>
        <div class="upgrade-card"><span>👑 1,000x Multiplier</span><button class="buy-btn" data-cost="5.0" data-mult="1000">5.0 POL</button></div>

        <hr style="border-color: #333; margin: 20px 0;">
        <button id="claimBtn" style="background: #00ffcc; color: #111; width: 100%; font-size: 18px;">Claim Click Vibe Tokens</button>
    </div>

    <script>
        let tokens = 0; let currentMultiplier = 1; let userWalletAddress = ""; let activeProvider = null;
        
        // 📌 CONFIGURATION VARIABLES
        const DEVELOPER_WALLET = "0xbC3863d3c7d3a9c40B8BB01ac6e8A27DB721331D"; // Your public Creator Wallet
        const BACKEND_URL = "https://click-vibe-backend.onrender.com"; // Your live Render backend URL

        const connectBtn = document.getElementById('connectWalletBtn');
        const walletStatus = document.getElementById('walletStatus');
        const coin = document.getElementById('coin');
        const balanceDisplay = document.getElementById('balance');

        // Handles clean native wallet detection
        async function initiateConnection() {
            // Check if MetaMask, Trust Wallet app browser, or Phantom is available
            const providerObject = window.ethereum || (window.web3 && window.web3.currentProvider);
            
            if (providerObject) {
                try {
                    connectBtn.disabled = true;
                    connectBtn.innerText = "Connecting...";
                    
                    activeProvider = new ethers.BrowserProvider(providerObject);
                    const accounts = await activeProvider.send("eth_requestAccounts", []);
                    
                    // Handle array response types securely
                    userWalletAddress = Array.isArray(accounts) ? accounts[0] : accounts;
                    
                    walletStatus.innerText = `Connected: ${userWalletAddress.substring(0,6)}...${userWalletAddress.substring(38)}`;
                    connectBtn.style.display = "none";
                } catch (err) {
                    alert("Connection request was rejected by your wallet app.");
                    resetConnectButton();
                }
            } else {
                alert("No crypto wallet detected! If you are on a phone, please open this website directly INSIDE the Trust Wallet or MetaMask internal browser app.");
                resetConnectButton();
            }
        }

        function resetConnectButton() {
            connectBtn.disabled = false;
            connectBtn.innerText = "🔌 Connect Wallet";
        }

        connectBtn.addEventListener('click', initiateConnection);

        coin.addEventListener('click', () => {
            tokens += (1 * currentMultiplier);
            balanceDisplay.innerText = tokens.toLocaleString();
        });

        // Handle Upgrades
        document.querySelectorAll('.buy-btn').forEach(button => {
            button.addEventListener('click', async (e) => {
                if (!userWalletAddress) return alert("Please connect your wallet first!");
                const costInPol = e.target.getAttribute('data-cost');
                const targetMultiplier = parseInt(e.target.getAttribute('data-mult'));

                try {
                    e.target.disabled = true; e.target.innerText = "Processing...";
                    const providerObject = window.ethereum || (window.web3 && window.web3.currentProvider);
                    const provider = new ethers.BrowserProvider(providerObject);
                    const signer = await provider.getSigner();

                    const tx = await signer.sendTransaction({
                        to: DEVELOPER_WALLET,
                        value: ethers.parseEther(costInPol)
                    });

                    await tx.wait();
                    currentMultiplier = targetMultiplier;
                    document.getElementById('multiplierText').innerText = `${currentMultiplier}x`;
                    document.getElementById('perClickText').innerText = currentMultiplier;
                    alert("Upgrade Successful!");
                } catch (err) {
                    alert("Transaction declined or cancelled.");
                } finally {
                    e.target.disabled = false; e.target.innerText = `${costInPol} POL`;
                }
            });
        });

        // Claim mechanics
        document.getElementById('claimBtn').addEventListener('click', async () => {
            if (!userWalletAddress) return alert("Connect wallet first!");
            if (tokens < 10000000) return alert("Minimum claim is 10,000,000 VIBE!");

            const claimBtn = document.getElementById('claimBtn');
            claimBtn.disabled = true; claimBtn.innerText = "Processing...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/claim`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ wallet: userWalletAddress, tokenAmount: tokens })
                });

                const data = await response.json();
                if (data.success) {
                    alert("Tokens Dispatched Successfully!"); tokens = 0; balanceDisplay.innerText = "0";
                } else {
                    alert(`System Rejection: ${data.message}`);
                }
            } catch (err) {
                alert("Server communication failed.");
            } finally {
                claimBtn.disabled = false; claimBtn.innerText = "Claim Click Vibe Tokens";
            }
        });
    </script>
</body>
</html>
